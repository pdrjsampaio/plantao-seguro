name: Android

# Compila, roda os testes e gera os APKs a cada envio.
# Nenhuma senha fica no repositório: a chave de assinatura está criptografada em
# assinatura/chave.tgz.enc e só é aberta aqui, com o secret PS_CHAVE.

on:
  push:
    branches: [main, v3]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PS_CHAVE: ${{ secrets.PS_CHAVE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Abrir a chave de assinatura (se o secret existir)
        id: chave
        run: |
          if [ -z "$PS_CHAVE" ]; then
            echo "tipo=teste" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret PS_CHAVE não configurado: o APK de release sai com assinatura de teste e não serve para distribuir."
            exit 0
          fi
          dir="$RUNNER_TEMP/chave"
          mkdir -p "$dir"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in assinatura/chave.tgz.enc -pass env:PS_CHAVE | tar xz -C "$dir"; then
            echo "tipo=erro" >> "$GITHUB_OUTPUT"
            echo "::error::Não consegui abrir assinatura/chave.tgz.enc com o PS_CHAVE informado."
            exit 0
          fi
          prop() { grep "^$1=" "$dir/chave.properties" | cut -d= -f2-; }
          sp="$(prop storePassword)"; kp="$(prop keyPassword)"; al="$(prop keyAlias)"
          echo "::add-mask::$sp"
          echo "::add-mask::$kp"
          {
            echo "PS_KEYSTORE=$dir/release.jks"
            echo "PS_KEYSTORE_PASSWORD=$sp"
            echo "PS_KEY_ALIAS=$al"
            echo "PS_KEY_PASSWORD=$kp"
          } >> "$GITHUB_ENV"
          echo "tipo=producao" >> "$GITHUB_OUTPUT"

      - name: Compilar, testar e analisar
        id: gradle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue --stacktrace \
            :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug \
            -Proborazzi.test.record=true 2>&1 | tee build.log

      - name: Conferir os APKs
        if: always()
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          : > apks.txt
          for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
            {
              echo "== $apk"
              echo "tamanho: $(stat -c %s "$apk") bytes"
              echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
              "$bt/zipalign" -c 4 "$apk" > /dev/null 2>&1 && echo "zipalign: ok" || echo "zipalign: FALHOU"
              "$bt/apksigner" verify --verbose --print-certs "$apk" 2>&1 | grep -v "^WARNING" || true
              "$bt/aapt2" dump badging "$apk" 2>&1 | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label)" || true
              echo
            } >> apks.txt
          done
          cat apks.txt

      - name: Publicar resultados no branch ci-resultados
        if: always()
        env:
          TIPO_CHAVE: ${{ steps.chave.outputs.tipo }}
          RESULTADO: ${{ steps.gradle.outcome }}
        run: |
          r="$RUNNER_TEMP/resultados"
          mkdir -p "$r"
          cp build.log apks.txt "$r/" 2>/dev/null || true
          [ -d app/build/reports/tests ] && cp -r app/build/reports/tests "$r/relatorio-testes"
          [ -d app/build/test-results ] && cp -r app/build/test-results "$r/resultados-testes"
          [ -d app/build/outputs/roborazzi ] && cp -r app/build/outputs/roborazzi "$r/telas"
          cp app/build/reports/lint-results-debug.txt "$r/lint.txt" 2>/dev/null || true
          cp app/build/reports/lint-results-debug.xml "$r/lint.xml" 2>/dev/null || true
          mkdir -p "$r/apk" "$r/ferramentas"
          find app/build/outputs/apk -name '*.apk' -exec cp {} "$r/apk/" \; 2>/dev/null || true
          # apksigner (Apache 2.0, do Android SDK) para assinar fora do GitHub quando preciso
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          cp "$bt/lib/apksigner.jar" "$r/ferramentas/" 2>/dev/null || true
          cat > "$r/LEIA.md" <<EOF
          # Resultados da compilação (não é uma versão publicada)

          - Commit: $GITHUB_SHA
          - Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Resultado do Gradle: $RESULTADO
          - Assinatura do release: $TIPO_CHAVE

          Estes arquivos servem para conferir a compilação. Para instalar o app,
          use apenas a página de versões (Releases) do repositório.
          EOF
          cd "$r"
          git init -q
          git checkout -q -b ci-resultados
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Resultados de ${GITHUB_SHA::7} (execução $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-resultados

  # Cenários de ponta a ponta num emulador Android 14, com notificações de
  # verdade publicadas pelo app auxiliar :simulador (que faz o papel do WhatsApp).
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Liberar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar o app, os testes e o simulador
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :simulador:assembleDebug

      - name: Preparar os APKs de release para o teste de fumaça
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # O release compilado agora, assinado com a chave de teste (só para instalar no emulador).
          "$bt/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out release-atual.apk app/build/outputs/apk/release/app-release-unsigned.apk
          # O APK já publicado desta versão, se existir (o arquivo que as pessoas instalam).
          versao="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if git fetch --depth 1 origin publicacao 2> /dev/null && \
             git show "origin/publicacao:v$versao/plantao-seguro-$versao.apk" > release-publicado.apk 2> /dev/null; then
            echo "Também será testado o APK publicado da v$versao."
          else
            rm -f release-publicado.apk
          fi

      - name: Rodar os cenários no emulador
        id: e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r simulador/build/outputs/apk/debug/simulador-debug.apk
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > e2e-gradle.log 2>&1 || touch e2e-falhou
            mkdir -p e2e-arquivos
            adb pull /sdcard/Android/data/com.plantaoseguro.debug/files/e2e e2e-arquivos/ || true
            adb logcat -d -v time -s E2E:V PlantaoSeguro:V AndroidRuntime:E TestRunner:V > e2e-arquivos/logcat.txt || true
            adb uninstall com.plantaoseguro.debug || true
            bash ferramentas/teste-release.sh release-atual.apk simulador/build/outputs/apk/debug/simulador-debug.apk e2e-arquivos/release-atual || touch release-falhou
            if [ -f release-publicado.apk ]; then bash ferramentas/teste-release.sh release-publicado.apk simulador/build/outputs/apk/debug/simulador-debug.apk e2e-arquivos/release-publicado || touch release-falhou; fi

      - name: Publicar resultados no branch ci-e2e
        if: always()
        run: |
          r="$RUNNER_TEMP/e2e"
          mkdir -p "$r"
          cp e2e-gradle.log "$r/" 2>/dev/null || true
          [ -d e2e-arquivos ] && cp -r e2e-arquivos/. "$r/"
          [ -d app/build/reports/androidTests/connected ] && cp -r app/build/reports/androidTests/connected "$r/relatorio-junit"
          [ -d app/build/outputs/androidTest-results/connected ] && cp -r app/build/outputs/androidTest-results/connected "$r/resultados-junit"
          resultado="passaram"
          [ -f e2e-falhou ] && resultado="algum cenário falhou (veja relatorio.md e e2e-gradle.log)"
          release="passou"
          [ -f release-falhou ] && release="falhou (veja release-*/release.md)"
          cat > "$r/LEIA.md" <<EOF
          # Cenários no emulador (Android 14)

          - Commit: $GITHUB_SHA
          - Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Cenários (APK de debug): $resultado
          - Teste de fumaça do APK de release: $release
          EOF
          cd "$r"
          git init -q
          git checkout -q -b ci-e2e
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Cenários no emulador para ${GITHUB_SHA::7} (execução $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-e2e
